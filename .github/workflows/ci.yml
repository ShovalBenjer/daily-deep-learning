name: CI

# Stage, in the sense ENGINEERING-STANDARDS section 2 means it: every pull
# request and every non-main push gets the checks plus a Pages preview with a
# unique URL, so proving CI ran something no longer requires deploying
# production. Never `|| true`: a check that cannot run must fail the job.
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    # Pin the default GITHUB_TOKEN to read-only; nothing here writes to
    # the repo (CodeQL actions/missing-workflow-permissions).
    permissions:
      contents: read
    steps:
      # depth 2, not 1: the call-site delta check below grades HEAD~1..HEAD,
      # and a shallow clone has no HEAD~1 to compare against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      # build domain of quality-contract.json
      - name: Validate the content graph
        run: python3 tools/validate_links.py

      # types domain, minus the shell script that needs a local bash on Windows
      - name: Syntax sweep
        run: |
          node --check sw.js
          python3 tools/check_inline_js.py
          python3 -m compileall -q tools
          bash -n tools/gen_art.sh

      - name: Curriculum budget against the deadline
        run: python3 tools/curriculum_budget.py

      # types domain, second half. Syntax checks cannot see this class: a cut
      # that removes a function's last caller leaves valid JS and a container
      # still in the DOM, so `node --check` and check_inline_js.py both pass
      # while the feature stops rendering. Measured against this repo's own
      # history: 8a917e3 orphaned counters() in writing/the-bench.html and it
      # stayed broken through 2008446 until e79d5b4 restored the two calls.
      # Hermetic, no secret, no browser, which is why it can run here at all.
      - name: Call-site delta
        run: |
          python3 tools/check_callsites.py --selftest
          python3 tools/check_callsites.py

      # unit domain of quality-contract.json, hermetic slice only. These five
      # files read index.html and daemon/server_parse.ts directly (server_parse
      # has zero imports of its own) and open no network connection, so they
      # are safe to run on any runner with no secret. tests/boundaries.test.ts
      # is deliberately excluded here, not deleted from the suite: it opens a
      # live round trip to the sadna-sync Worker, which needs a SYNC_KEY this
      # repo has no secret for (`gh secret list` shows only
      # CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CLAUDE_CODE_OAUTH_TOKEN),
      # and 5 of its 10 tests also need a local daemon on :8788 that this
      # runner cannot start. Full tests/boundaries.test.ts stays a local-only
      # check; see quality-contract.json domains.pipeline for the remainder.
      - name: Unit tests, hermetic slice
        run: bun test tests/mentor.test.ts tests/decks.test.ts tests/contract.test.ts tests/fuzz.test.ts tests/mutation.test.ts

      # types domain, third half: the game is TypeScript strict by ADR-0002,
      # and the commitment is enforced here as well as in the local gate.
      - name: Game strict typecheck
        run: cd game && bun install --frozen-lockfile && bun x tsc --noEmit

      # docs control plane (tools/check_docs_index.py). On this runner the
      # local-only docs population does not exist, so the check prints its
      # "inactive" notice and passes; it runs here so the tool itself cannot
      # rot unexecuted, and so the pipeline builtin sees the step.
      - name: Docs control plane
        run: python3 tools/check_docs_index.py

      # Fails if any forbidden path reaches the upload, so the publication
      # boundary is enforced by CI rather than by remembering.
      - name: Stage the site and audit the boundary
        run: python3 tools/stage_site.py dist

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools
        run: python3 -m pip install ruff mypy
      - name: Lint Python tools
        run: ruff check tools/
      - name: Type-check Python tools
        run: mypy tools/

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Type-check daemon
        run: cd daemon && bun install && bun x tsc --noEmit
      - name: Type-check game
        run: cd game && bun install --frozen-lockfile && bun x tsc --noEmit
      - name: Type-check e2e
        run: cd e2e && bun install --frozen-lockfile && bun x tsc --noEmit

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      # The self-contained e2e lane (e2e/playwright.config.ts): boots the
      # static site the same way the local dev loop does and runs the boot,
      # interaction, and axe accessibility suites on a phone-sized viewport.
      # This is the step that retired the pipeline waiver's private-repo
      # blocker: nothing here reaches outside this repository.
      - name: Install e2e dependencies
        run: cd e2e && bun install --frozen-lockfile
      - name: Install chromium
        run: cd e2e && bun x playwright install --with-deps chromium
      - name: Playwright suite (app + a11y)
        run: cd e2e && bun x playwright test --config playwright.config.ts

  preview:
    needs: checks
    runs-on: ubuntu-latest
    # Cloudflare auth comes from its own secrets, so GITHUB_TOKEN needs
    # nothing beyond reading the checkout.
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Stage the shippable site
        run: python3 tools/stage_site.py dist
      - name: Publish a preview deployment
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=daily-deep-learning --branch=${{ github.head_ref }}
