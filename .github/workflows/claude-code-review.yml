name: Claude Code Review

# Always-fresh review: `synchronize` fires on EVERY push to the PR branch, and the
# concurrency group cancels any in-flight review so each push starts a fresh one
# (workflow equivalent of "@claude review always" on a Manual-mode repo).
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts; reviews restart when marked ready
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            Perform a fresh, full review of this PR (do not assume prior reviews).
            Focus, in order: (1) correctness bugs that break behavior, (2) security
            (anchor findings to OWASP/CWE where applicable), (3) contract/boundary
            violations (typed DTOs, unchecked errors at IO edges), (4) performance,
            (5) maintainability. Rules:
            - Cite evidence from the diff for every finding, or mark it "Possible issue".
            - Fix suggestions must be <=15 lines or cite a library/utility.
            - Tiered depth: Critical/High get code snippets; Low gets one line.
            - Max 5 nits; count the rest in the summary.
            - Do not report style that CI already enforces.
          # claude_args is a literal block passed straight to the CLI, so a `#`
          # line inside it is an argument, not a comment. Rationale lives here,
          # outside the block, on purpose.
          #
          # --max-turns was 10, raised 2026-08-10 because 10 could only ever
          # review a trivial diff. On PR #3 the action failed twice with
          # "Execution failed: Reached maximum number of turns (10)", both times
          # at the same point: the progress checklist showed "Gather context"
          # ticked and "Read tools/check_callsites.py" still open, so it spent
          # every turn reading and never reached the step that posts the review.
          # The prompt above asks for five ordered passes over the diff; the only
          # run that ever completed was 2026-07-30, on a one-line workflow
          # change. A reviewer that cannot finish is not an allowance, and
          # merges-are-the-operators requires every reviewer to allow before the
          # operator merges, so this cap was silently blocking that rule rather
          # than enforcing a budget.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
