name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate content graph
        run: python3 tools/validate_links.py
      # The game ships as a build tree: tools/stage_site.py maps
      # "game/dist:game" (required SHIP entry), so the build must run
      # before staging or the stager fails loudly on the missing entry.
      - name: Install bun and build the game
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Build the game
        run: cd game && bun install --frozen-lockfile && bun run build
      # Deploys the staged allowlist, never the repo root: Pages has no ignore
      # file, so uploading `.` would publish docs/, state/ and drafts. The
      # stager exits non-zero if a forbidden path reaches the staged tree.
      - name: Stage the shippable site
        run: python3 tools/stage_site.py dist
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=daily-deep-learning --branch=main --commit-dirty=true
      # The writing site is a separate Pages project (operator decision
      # 2026-07-29): same account, own allowlist, own deploy. Project name is
      # case-ledgers because the-bench.pages.dev is a third party's project
      # (first deploy failed with "Project not found" [8000007]).
      - name: Stage the writing site
        run: python3 tools/stage_writing.py dist-writing
      - name: Create the writing project if missing
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create case-ledgers --production-branch=main
      - name: Deploy writing to Cloudflare Pages (case-ledgers)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-writing --project-name=case-ledgers --branch=main --commit-dirty=true
