  <g id="g-ladder"><path d="M6.5 3 h11 v17 l-5.5 -3.6 L6.5 20 Z M9.5 7.5 h5"/></g>

  <g id="a-crown"><path d="M4 8 l4 3 4 -6 4 6 4 -3 -1.5 8 h-13 Z M5.5 18.5 h13"/></g>
</defs></svg>
<header class="bar">
  <a class="wordmark" href="#/"><b>ה</b>סדנה <span class="alpha-chip">אלפא</span></a>
  <div id="spark" aria-hidden="true"><svg viewBox="0 0 32 40">
    <path class="sp-lantern" d="M7 13 L16 5 L25 13 V33 a2.5 2.5 0 0 1 -2.5 2.5 h-13 A2.5 2.5 0 0 1 7 33 Z"/>
    <circle class="sp-ring" cx="16" cy="4.5" r="2"/>
    <g class="sp-fl"><path class="sp-flame" d="M16 14.5 C20 19.5 21 22 21 25 a5 5 0 1 1 -10 0 C11 22 12 19.5 16 14.5 Z"/>
    <path class="sp-flame-in" d="M16 20.5 C18 23 18.4 24.3 18.4 25.7 a2.4 2.4 0 1 1 -4.8 0 C13.6 24.3 14 23 16 20.5 Z"/>
    <circle class="sp-eye" cx="14.5" cy="25" r=".95"/><circle class="sp-eye" cx="17.5" cy="25" r=".95"/></g>
  </svg></div>
  <span id="xpwrap"><span class="folio" id="folio"></span><span id="xpbar"><span id="xpfill"></span></span></span>
  <svg id="ring" viewBox="0 0 36 36" aria-label="התקדמות היום"><circle class="rbg" cx="18" cy="18" r="15.5"/><circle class="rfg" cx="18" cy="18" r="15.5"/><text x="18" y="21.5" text-anchor="middle">0</text></svg>
  <button class="iconbtn" id="sndToggle" aria-label="צליל">
    <svg id="sndIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19Z"/><path class="snd-waves" d="M15 9.5a4 4 0 0 1 0 5M17.5 7a7.5 7.5 0 0 1 0 10"/></svg>
  </button>
  <button class="iconbtn" id="themeToggle" aria-label="מצב תאורה">
    <svg id="sunIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
    <svg id="moonIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" hidden><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<main>
  <div id="status">טוען...</div>
  <div id="view"></div>
</main>

<nav class="tabs">
  <a href="#/" id="tab-today"><svg class="tg" viewBox="0 0 24 24"><use href="#g-today"/></svg><span>היום</span><span class="tab-badge" id="bdgToday"></span></a>
  <a href="#/map" id="tab-map"><svg class="tg" viewBox="0 0 24 24"><use href="#g-map"/></svg><span>העץ</span><span class="tab-badge" id="bdgMap"></span></a>
  <a href="#/kodex" id="tab-kodex"><svg class="tg" viewBox="0 0 24 24"><use href="#g-kodex"/></svg><span>האוצר</span></a>
  <a href="#/discover" id="tab-discover"><svg class="tg" viewBox="0 0 24 24"><use href="#g-discover"/></svg><span>תגליות</span></a>
  <a href="#/ladder" id="tab-ladder"><svg class="tg" viewBox="0 0 24 24"><use href="#g-ladder"/></svg><span>המסלול</span></a>
</nav>

<div id="qplayer" role="dialog" aria-modal="true" aria-label="בוחן" hidden>
  <div class="qp-head"><span id="qpProgress"></span><button class="iconbtn" id="qpClose" aria-label="סגור">✕</button></div>
  <div id="qpBody"></div>
</div>
<div id="toast"><span id="toastMsg"></span></div>
<canvas id="fx"></canvas>
<div id="overlay" role="dialog" aria-modal="true" hidden><div class="ov-plate plate"><div id="ovBody"></div><button id="ovClose">המשך</button></div></div>

<button id="chatFab" aria-label="שיחה עם המורה" hidden>המורה</button>
<div id="chatPane" role="dialog" aria-modal="true" aria-label="המורה" hidden>
  <div class="cp-head"><b id="cpName">המורה</b><span id="cpStatus"></span>
    <button class="iconbtn" id="cpClose" aria-label="סגור">✕</button></div>
  <div id="cpLog"></div>
  <form id="cpForm"><input id="cpInput" type="text" autocomplete="off" placeholder="שאל, או הדבק תשובה לדירוג...">
    <button id="cpSend">שלח</button></form>
</div>

<script src="vendor/marked.min.js"></script>

<script src="src/app.js"></script>
