[project]
name = "daily-deep-learning"
version = "0.1.0"
description = "Daily deep learning PWA, tools, daemon, and game"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tools"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
